<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Tienda | Catálogo Online</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="header">
    <h1>🛍️ Mi Tienda</h1>
    <p class="subtitulo">Ventas de perfumes, faciales, cuidado de piel.</p>
    <a th:href="@{/carrito}" class="btn-carrito">
        🛒 Carrito <span class="badge" th:text="${cantidadCarrito}">0</span>
    </a>
</header>

<nav class="filtros">
    <a th:href="@{/tienda}" class="filtro">Todos</a>
    <a th:each="cat : ${categorias}"
       th:href="@{/tienda(categoriaId=${cat.id})}"
       class="filtro"
       th:text="${cat.nombre}">Categoria</a>
</nav>

<main class="grid-productos">
    <div class="card" th:each="p : ${productos}">
        <img th:src="${p.imagenUrl}" th:alt="${p.nombre}">
        <h3 th:text="${p.nombre}">Nombre del producto</h3>
        <p class="categoria" th:if="${p.categoria}" th:text="${p.categoria.nombre}">General</p>
        <p class="precio" th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'NONE')}">$0</p>

        <form th:action="@{/carrito/agregar}" method="post">
            <input type="hidden" name="productoId" th:value="${p.id}">
            <button type="submit" class="btn-agregar">Agregar</button>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 Mi Tienda. Todos los derechos reservados.</p>
    <p><a th:href="@{/admin}" style="color:#bbb;">Panel de administración</a></p>
</footer>

</body>
</html>
