# ------------------------------
# Conexion a PostgreSQL
# Los valores despues de ":" son los que se usan en TU COMPU si no
# configuras variables de entorno. En produccion (Render, Railway, etc.)
# estas variables se sobreescriben desde el panel del hosting - ver README.
# ------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4555}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Carga datos de ejemplo la primera vez (comenta esta linea despues de la primera corrida si no quieres duplicados)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# En hostings como Render, el puerto real lo define una variable de entorno
# llamada PORT; en tu compu, si no existe, usa el 8080 de siempre.
server.port=${PORT:8080}

# ------------------------------
# Subida de imagenes de productos
# ------------------------------
app.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------
# Usuario y clave del panel /admin
# Cambia estos valores antes de publicar la app en internet.
# En produccion, definilos como variables de entorno ADMIN_USERNAME y ADMIN_PASSWORD.
# ------------------------------
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:4555}
